tic/chunks/0ufwmbm9ml7cb.js\"],\"default\"]\n12:T438,Almagest — Remnants of Rebirth is an immersive digital experience created to introduce visitors to an original fantasy universe inspired by anime, mythology and cosmic storytelling. The website acts as the central gateway to the project, bringing together its story, characters, spellbook, universe, music and visual artwork within a cohesive interactive experience.\n\\n\\n\nThe interface was designed to preserve the richness of the original illustrations while guiding visitors naturally through a large amount of narrative content. Cinematic compositions, layered visuals, atmospheric transitions and carefully crafted typography help translate the identity of the fictional world into an engaging web experience.\n\\n\\n\nBeyond presenting the universe, the website provides direct access to the book and manga, allowing the project to connect storytelling, illustration and music in one digital destination. Particular attention was given to responsive behaviour, visual continuity and interaction design so that the experience remains immersive across desktop and mobile devices.13:T50e,Communication between aircraft pilots and air traffic controllers is mainly by radio. However, this type of communication involves certain difficulties, such as poor reception and the need to pay close attention to exchanges on the active frequency so as not to miss certain flight instructions. At the turn of the 2000s, the arrival of a new data exchange protocol, called CPDLC for Controller Pilot Data Link Communication, opened a new air-ground communication channel.\n\\n\\n\nCPDLC communication is based on the use of pre-established messages (ATN \u0026 FANS), which the interlocutor (pilot or controller) selects to initiate exchanges. Although recent avionics systems offer pilots an application for CPDLC communication, it is not very usable, especially for advanced functions (sending complex messages, ...).\n\\n\\n\nThe aim of the project was therefore to consider solutions from a human factors point of view, offering users of this system less complexity in carrying out their actions. A user-centered design approach was applied, and the work carried out was based on consideration of the human factor and feedback from user experience. A series of workshops and stages followed, including business understanding and requirements gathering, scientific research, prototyping and development.14:T52d,The modernization project aimed to transform the supervision software by streamlining its interface and enhancing user experience. One of the key objectives was to reduce the overwhelming complexity of the existing system, which consisted of 30 screens, to just 2 screens while ensuring that essential functionalities remained accessible. It involved collaboration with various stakeholders within the aeronautical sector, including the DTI, the SNA of Blagnac, the CESNAC, and CRNA S/O of Bordeaux.\n\\n\\n\nA user-centered design approach was adopted to ensure that the new software met the needs and expectations of its users. This involved conducting contextual interviews with air traffic controllers, supervisors, and other personnel involved in air traffic management. These interviews provided valuable insights into the challenges and pain points of the existing system, as well as the specific requirements and preferences of the users.\n\\n\\n\nFinally, the project was presented during the SACSO seminar in Paris, providing an opportunity to showcase the modernization efforts to key stakeholders and decision-makers in the aeronautical supervision community. This presentation highlighted the benefits of the new software and dem"])</script><script>self.__next_f.push([1,"onstrated how it would improve efficiency, safety, and user satisfaction in ATM operations.15:T484,UCOLIS revolutionizes transportation and logistics with its versatile mobile application, catering to the needs of both individuals and businesses. Whether it's a quick trip across town or a longer excursion, users can rely on UCOLIS to provide reliable transportation solutions tailored to their unique requirements.\n\\n\\n\nOne of the standout features of UCOLIS is its innovative approach to parcel delivery. Users can dispatch packages to multiple destinations simultaneously, streamlining the entire delivery process. Moreover, UCOLIS embraces cutting-edge technology to offer an unparalleled user experience. The app's Customer/Courier mode caters to both sides of the delivery spectrum, allowing users to seamlessly switch between sending and receiving parcels with just a few taps. Additionally, UCOLIS incorporates voice control functionality, adding another layer of convenience for users on the go. \n\\n\\n\nBy prioritizing user-centric design and leveraging the latest advancements in mobility and logistics, UCOLIS sets a new standard in transportation solutions, empowering individuals and businesses to navigate the world with ease and efficiency.16:T50f,Imagine strolling through the picturesque grounds of UBC Okanagan, surrounded by its stunning architecture and vibrant atmosphere. That's precisely what the app does, it seamlessly integrates Google ARCore Geospatial API with the campus map, allowing users to explore 3D models of buildings, landmarks, and even interactive exhibits right from their smartphones. Whether you're a prospective student eager to envision yourself on campus or an alumnus feeling nostalgic, this app transforms the physical space into an immersive metaverse, bridging the gap between the real and virtual worlds.\n\\n\\n\nWith just a few taps on your phone, you can navigate the campus with pinpoint accuracy, thanks to the AR-powered geospatial features. Want to see how a new building will fit into the existing landscape? Simply point your device and watch as the digital model seamlessly integrates with your surroundings. Moreover, the app fosters community engagement by allowing users to share their augmented reality experiences, sparking conversations and connections within the UBCO community. It's not just about showcasing 3D models, it's about creating a dynamic, interactive platform that redefines how we interact with our environment, paving the way for a new era of spatial exploration in the metaverse."])</script><script>self.__next_f.push([1,"2:[\"$\",\"$L11\",null,{\"db\":{\"availability\":\"now\",\"title\":\"Creative Developer\",\"picture\":{\"fields\":{\"title\":\"Yanne Sidibe\",\"description\":\"\",\"file\":{\"url\":\"//images.ctfassets.net/9fbmaqn9d9lb/4DbcksADHmSgw7omJbUFCt/a7d2c3b5a4c0dc95502934f6992715b3/pic.png\",\"details\":{\"size\":1988134,\"image\":{\"width\":1586,\"height\":1762}},\"fileName\":\"pic.png\",\"contentType\":\"image/png\"}}},\"firstname\":\"Yanne\",\"lastname\":\"Sidibé\",\"about\":\"An award-winning, product-minded frontend engineer with a background in aerospace engineering and human factors. I design and build visually striking web and mobile products where usability, reliability and performance matter—from concept to launch, with a strong focus on thoughtful UX, engaging interactions and practical AI-powered workflows.\",\"email\":\"yannesidibe.pro@gmail.com\",\"flag\":false,\"socials\":[{\"fields\":{\"name\":\"Linkedin\",\"link\":\"https://www.linkedin.com/in/yanne-s-0a6a60b8\"}},{\"fields\":{\"name\":\"Threads\",\"link\":\"https://www.threads.net/@yanne_sidibe\"}},{\"fields\":{\"name\":\"Awwwards\",\"link\":\"https://www.awwwards.com/yannesidibe\"}}],\"clients\":[{\"fields\":{\"name\":\"Tetiana Mamai\",\"title\":\"ADP Airport Operations\",\"message\":\"Yanne will be an asset to any organization looking for someone to carry out complex data analysis projects. I highly recommend him for any future professional opportunities !\",\"color\":\"#FBF9FF\"}},{\"fields\":{\"name\":\"Gian Luca Biechler\",\"title\":\"Head of Radio Summernight\",\"message\":\"Great work, the RSN Radio Player mobile app turned out really perfect. I
